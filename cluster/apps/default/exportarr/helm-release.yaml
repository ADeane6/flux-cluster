---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: exportarr
  namespace: default
spec:
  interval: 5m
  chart:
    spec:
      chart: app-template
      version: 3.7.3
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 5
  upgrade:
    remediation:
      retries: 5
  values:
    controllers:
      radarr:
        containers:
          main:
            image:
              repository: ghcr.io/onedr0p/exportarr
              tag: v2.0.1
            args:
              - radarr
            env:
              PORT: "9707"
              URL: "http://radarr.default.svc.cluster.local:7878"
              APIKEY:
                valueFrom:
                  secretKeyRef:
                    name: exportarr-secrets
                    key: RADARR_API_KEY
      sonarr:
        containers:
          main:
            image:
              repository: ghcr.io/onedr0p/exportarr
              tag: v2.0.1
            args:
              - sonarr
            env:
              PORT: "9708"
              URL: "http://sonarr.default.svc.cluster.local:8989"
              APIKEY:
                valueFrom:
                  secretKeyRef:
                    name: exportarr-secrets
                    key: SONARR_API_KEY
    service:
      radarr:
        controller: radarr
        ports:
          metrics:
            port: 9707
      sonarr:
        controller: sonarr
        ports:
          metrics:
            port: 9708
